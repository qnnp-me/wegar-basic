name: quality
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer lint
      - run: composer analyse
      # 单测仅跑一次：test:coverage 内含 phpunit，避免 check 后再重复跑一套（BL-006）
      - run: composer test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.php }}
          path: build/coverage/clover.xml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/cache@v4
        with:
          path: .webman-host
          key: webman-host-${{ hashFiles('composer.lock', 'tests/Tools/HostApp.php') }}
      - run: composer install --no-interaction --prefer-dist
      - run: composer host:setup
      - run: composer test:integration

  # 「最新允许版本」单测：抬高 platform 后解析出 PHPUnit 13 / sebastian-diff 9 /
  # monolog 3 等最新兼容组合。8.3 平台锁定仍由 unit job 保证最低版本可装；
  # 本 job 负责验证最新组合并捕捉上游漂移。
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer config platform.php 8.4.99
      - run: composer update --with-all-dependencies --no-interaction --prefer-dist
      - run: composer test
